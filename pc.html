<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PC自動起動用ファイル</title>
<style>
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; background:#f6f7fa; color:#1e2533; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; color:#1f2a44; }
  .card { background:#fff; border-radius:12px; padding:18px; margin:14px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  a.dl { display:block; text-align:center; background:#1f2a44; color:#fff; text-decoration:none; font-weight:bold; font-size:17px; padding:14px; border-radius:10px; margin-top:10px; }
  p { line-height:1.7; }
  .sub { color:#5b6b82; font-size:14px; }
</style></head>
<body><main>
  <h1>Macを起動したら自動で開く設定 ― ファイルのダウンロード</h1>
  <p class="sub">下のボタンを押してダウンロードしてください。設定のしかたは「業務管理システム 導入マニュアル」を見てください。</p>
  <div class="card"><b>Mac の方</b>
    <a class="dl" href="pc/fukuoka-gyomu.webloc" download="業務管理システム.webloc">Mac用をダウンロード</a></div>
  <p class="sub">ダウンロードしたファイルは「ダウンロード」フォルダに入ります。<b>「ホーム」フォルダ（自分の名前のフォルダ）にコピーしてから</b>設定してください。「書類」「デスクトップ」「ダウンロード」に置くと、起動時に開きません。</p>
</main></body></html>
